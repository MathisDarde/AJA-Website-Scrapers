name: Tests des scrapers

on:
  push:
    branches: [main]
    paths: ["public/scripts/**", "tests/**", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pages enregistrées : aucun accès réseau, pas besoin de navigateur
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -v
