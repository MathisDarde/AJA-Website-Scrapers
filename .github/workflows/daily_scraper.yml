name: AJ Auxerre Scrapers

on:
  schedule:
    # Calendrier, classement et statistiques toutes les 2 heures : un résultat est publié
    # au plus ~2 h après la fin d'un match (GitHub décale parfois les cron de quelques minutes)
    - cron: "17 */2 * * *"
    # Une fois par jour, l'effectif en plus (aja.fr, une requête par joueur)
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Deux passages ne doivent jamais se chevaucher (push concurrents)
concurrency:
  group: scrapers
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # La saison et le championnat (Ligue 1 / Ligue 2) sont déterminés automatiquement.
      # Un scraper en échec garde le fichier précédent et n'empêche pas les autres.
      - name: Scrape
        id: scrape
        continue-on-error: true
        run: python public/scripts/run_all.py ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 4 * * *') && '--effectif' || '' }}

      - name: Commit JSON updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [[ -n $(git status --porcelain data/) ]]; then
            git add data/
            git commit -m "Update scraped JSON [skip ci]"
          fi

          # GitHub désactive les cron d'un dépôt sans activité depuis 60 jours (l'été, rien ne
          # change) : un commit vide toutes les 4 semaines au plus les garde actifs.
          if (( $(date +%s) - $(git log -1 --format=%ct) > 28 * 24 * 3600 )); then
            git commit --allow-empty -m "Keepalive des scrapers planifiés [skip ci]"
          fi

          if [[ -n $(git log origin/main..HEAD) ]]; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Rend le run rouge (et déclenche le mail de GitHub) si un scraper a échoué
      - name: Report scraper failures
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Au moins un scraper a échoué, voir l'étape Scrape"
          exit 1
